<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>隐私政策</title>
    <link rel="stylesheet" href="resource/common.css">
    <script src="resource/loadBanner.js"></script>
    <script src="resource/loadFooter.js"></script>
    <style>
        .privacy-content {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px;
        }
        .privacy-content h2 {
            color: var(--primary-color);
            font-size: 32px;
            margin-bottom: 30px;
            text-align: center;
            position: relative;
            padding-bottom: 15px;
        }
        .privacy-content h2::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 3px;
            background-color: var(--secondary-color);
        }
        .privacy-content p {
            line-height: 1.8;
            color: var(--text-color);
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="content-wrapper">
        <div class="privacy-content">
            <h2>隐私政策</h2>
            <p>我们重视您的隐私。本隐私政策说明了我们如何收集、使用和保护您的个人信息。</p>
            <p>我们收集的信息仅用于提供医疗服务，不会与第三方共享，除非法律要求。</p>
            <p>我们采取适当的安全措施来保护您的个人信息，防止未经授权的访问、披露或修改。</p>
        </div>
    </div>
</body>
</html>
