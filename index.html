<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dr. Ma Medical - Family Medicine</title>
    <meta name="description" content="Dr. Ma Medical - Professional family medicine services in NYC. Board-certified family medicine physician with over 11 years of experience.">
    
    <!-- 语言版本链接 -->
    <link rel="alternate" hreflang="en" href="/en/index.html" />
    <link rel="alternate" hreflang="zh" href="/zh/index.html" />
    <link rel="alternate" hreflang="x-default" href="/en/index.html" />
    
    <script>
        // 获取用户浏览器语言
        const userLang = navigator.language || navigator.userLanguage;
        
        // 判断是否为中文（包括简体中文和繁体中文）
        const isChinese = userLang.startsWith('zh');
        
        // 根据语言跳转到对应版本
        window.location.href = isChinese ? 'zh/index.html' : 'en/index.html';
    </script>
</head>
<body>
    <noscript>
        <p>Please select your preferred language:</p>
        <ul>
            <li><a href="/en/index.html">English</a></li>
            <li><a href="/zh/index.html">中文</a></li>
        </ul>
    </noscript>
</body>
</html>
