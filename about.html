<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>关于我们</title>
    <link rel="stylesheet" href="resource/common.css">
    <script src="resource/loadBanner.js"></script>
    <script src="resource/loadFooter.js"></script>
    <style>
        .about-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px;
        }
        .about-section {
            margin-bottom: 40px;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .about-section h2 {
            color: var(--primary-color);
            margin-bottom: 20px;
            font-size: 28px;
            position: relative;
            padding-bottom: 10px;
        }
        .about-section h2::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 50px;
            height: 3px;
            background-color: var(--secondary-color);
        }
        .about-section p {
            line-height: 1.8;
            color: var(--text-color);
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="content-wrapper">
        <div class="about-content">
            <div class="about-section">
                <h2>关于我们</h2>
                <p>我们是一家专业的家庭医疗诊所，致力于为社区提供高质量的医疗服务。我们的医生团队拥有丰富的临床经验，为患者提供全面的医疗保健服务。</p>
            </div>
            <div class="about-section">
                <h2>我们的使命</h2>
                <p>我们的使命是为每个家庭提供可及的、高质量的医疗服务，帮助患者获得最佳的健康状态。</p>
            </div>
        </div>
    </div>
</body>
</html>
